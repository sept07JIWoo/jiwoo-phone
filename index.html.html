function closeApp(){$('app').classList.remove('open');current=''}
function renderApp(){const c=$('appcontent');c.className='content';if(current==='chat'||current==='sms'){c.style.background='#e9eff9';c.innerHTML='<div class="chatdate">지우 ♡ · 우리만의 대화</div>'+chat.map(m=>`<div class="chatline ${m.from==='me'?'mine':''}">${m.from==='me'?'':'<div class="avatar">♡</div>'}<div class="bubble">${escapeHTML(m.text)}</div></div>`).join('');c.scrollTop=c.scrollHeight;return}c.style.background='';if(current==='tweets'){c.innerHTML=CONFIG.tweets.map(t=>`<article class="card tweet"><strong>♡ ${escapeHTML(t.name)}</strong> <span class="meta">${escapeHTML(t.handle)} · ${escapeHTML(t.time)}</span><p>${escapeHTML(t.text)}</p><div class="actions">♡ ${Number(t.likes)||0}　↗ 공유</div></article>`).join('');return}if(current==='photos'){c.innerHTML='<h3>우리의 순간들 ♡</h3><p class="muted">사진을 넣으려면 CONFIG.photos에 이미지 경로를 추가하세요.</p><div class="gallery">'+CONFIG.photos.map(p=>`<button class="photo" onclick="notify('소중한 추억 ♡')">${String(p).match(/^(data:image\/|\.?\/|https?:)/)?`<img alt="추억" src="${escapeHTML(p)}" style="width:100%;height:100%;object-fit:cover">`:escapeHTML(p)}</button>`).join('')+'</div>';return}if(current==='notes'){c.classList.add('notes');c.innerHTML='<div class="card"><div class="muted">우리의 메모 · 자동 저장</div><textarea id="notetext"></textarea></div>';$('notetext').value=localStorage.getItem('jiwoo_notes')??CONFIG.notes;$('notetext').oninput=e=>localStorage.setItem('jiwoo_notes',e.target.value);return}if(current==='calendar'){c.innerHTML='<h2>오늘의 일정 ♡</h2>'+CONFIG.schedule.map(e=>`<div class="card"><b>${escapeHTML(e.time)}</b><p>${escapeHTML(e.title)}</p></div>`).join('');return}if(current==='letter'){c.innerHTML='<div class="card" style="line-height:2"><div class="muted">To. 나의 가장 소중한 사람</div><h2>언제나 네 편이야 ♡</h2><p>오늘 하루도 수고했어.<br>너의 웃는 얼굴이 오래오래 빛났으면 좋겠어.<br>우리 앞으로도 예쁜 추억 많이 만들자.</p><div style="text-align:right">From. 지우 (상상 속 편지) 💌</div></div>';return}if(current==='call'){c.innerHTML='';c.style.padding='0';c.style.display='flex';c.innerHTML=`<div class="callface"><div class="round">♡</div><h1>${escapeHTML(CONFIG.callName)}</h1><p id="callstate">연결 중...</p><button class="callbtn" onclick="closeApp()">☎</button><small>가상 통화 화면</small></div>`;setTimeout(()=>{if(current==='call')$('callstate').textContent='보고 싶어 ♡'},1800);return}if(current==='camera'){c.innerHTML='<div class="card" style="text-align:center"><h2>📷 우리의 카메라</h2><p>사진을 찍는 대신 추억을 남겨 볼까요?</p><button class="smallbtn" onclick="notify(\'찰칵! 오늘도 예쁜 하루 ♡\')">찰칵 ♡</button></div>';return}if(current==='music'){c.innerHTML='<div class="card" style="text-align:center"><div style="font-size:65px">🎧</div><h2>우리의 플레이리스트</h2><p>너랑 함께 듣고 싶은 노래들 ♡</p><p class="muted">오프라인 데모 · 음원 재생 없음</p></div>';return}if(current==='settings'){c.innerHTML='<div class="card"><h3>설정 ⚙</h3><p>지우와 나의 작은 세상 ♡</p><p class="muted">팬이 만든 가상 연애 시뮬레이션입니다. 실제 인물의 메시지나 계정이 아닙니다.</p><button class="smallbtn" id="reset">채팅 초기화</button></div>';$('reset').onclick=()=>{chat=CONFIG.chat.map(x=>({...x}));saveChat();notify('채팅이 초기화되었어요')};return}}
function sendMessage(){const input=$('message');const value=input.value.trim();if(!value)return;chat.push({from:'me',text:value});saveChat();input.value='';renderApp();notify('메시지를 보냈어요 ♡')}$('message').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script></body></html>
